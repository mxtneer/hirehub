<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HireHub — Find • Apply • Grow</title>
<meta name="description" content="HireHub demo — jobs, career tools, hiring and local gigs.">
<style>
:root{--navy:#101d3a;--blue:#3268ed;--pale:#eef3ff;--ink:#17233b;--muted:#6b7690;--line:#e5e9f2;--bg:#f7f9fd;--white:#fff;--green:#13795b;--red:#b42318;--amber:#8a4b08}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:700}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9bb8ff;outline-offset:2px}.primary{background:var(--blue);color:white}.secondary{background:#edf1fa;color:var(--navy)}.outline{background:white;color:var(--navy);border:1px solid var(--line)}.danger{background:#fff0ef;color:var(--red)}.muted{color:var(--muted)}.small{font-size:12px}.hidden{display:none!important}.wrap{max-width:1180px;margin:auto;padding:0 20px}.top{background:var(--navy);color:white;position:sticky;top:0;z-index:5}.nav{min-height:70px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-size:23px;font-weight:900;letter-spacing:-.8px}.brand span{color:#85a6ff}.nav-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nav select{background:#1d2d50;color:white;border:1px solid #455577;border-radius:8px;padding:8px}.hero{background:linear-gradient(130deg,#101d3a,#1e4388);color:white;padding:54px 0}.hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:28px;align-items:center}.eyebrow{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#b5caff;font-weight:800}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.06;letter-spacing:-1.7px;margin:12px 0}.hero p{font-size:17px;color:#dbe5ff;max-width:650px}.hero-card,.card,.auth-card,.side,.stat,.job-item{background:white;border:1px solid var(--line);border-radius:16px;padding:18px}.hero-card{color:var(--ink);box-shadow:0 20px 45px #07142e44}.hero-card p{font-size:14px;color:var(--muted)}.searchbox{display:flex;gap:8px;flex-wrap:wrap;background:white;border-radius:14px;padding:9px;margin-top:22px}.searchbox input{flex:1;min-width:130px;border:0;padding:10px;color:var(--ink)}.section{padding:30px 0}.section-head,.dash-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.section h2,.dash-head h1{margin:0;font-size:25px;letter-spacing:-.5px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card h3,.job-item h3{margin:0 0 6px}.tag{display:inline-block;border-radius:7px;padding:4px 8px;background:#edf2ff;color:#3158ad;font-size:11px;font-weight:800;margin:3px 4px 3px 0}.pill{display:inline-block;padding:5px 8px;border-radius:7px;background:#eaf8f1;color:#087443;font-size:11px;font-weight:800}.field{display:flex;flex-direction:column;gap:5px;margin:12px 0}.field label{font-size:13px;font-weight:750}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;min-width:0;border:1px solid #d9dfeb;border-radius:9px;padding:11px;background:white;color:var(--ink)}textarea{min-height:90px;resize:vertical}.auth-area{max-width:510px;margin:30px auto;padding:0 16px}.auth-card{padding:25px}.auth-card h1{margin:8px 0}.dash{display:grid;grid-template-columns:205px minmax(0,1fr);gap:20px;padding-top:24px;padding-bottom:45px}.side{height:max-content;position:sticky;top:90px;padding:10px}.side button{display:block;width:100%;text-align:left;background:transparent;color:#52617d;margin:2px 0}.side button.active,.side button:hover{background:var(--pale);color:var(--blue)}.dash-main{min-width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat strong{display:block;font-size:25px}.stat{padding:15px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{flex:1}.list{display:grid;gap:12px}.job-item{padding:17px}.job-top{display:flex;justify-content:space-between;gap:10px;align-items:start}.status{font-size:11px;font-weight:800;text-transform:uppercase;background:#edf2ff;color:#3158ad;border-radius:7px;padding:5px 8px;white-space:nowrap}.status.good{background:#e5f7ef;color:#087443}.status.warn{background:#fff0e4;color:#a34a00}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.empty{padding:28px;text-align:center;background:white;border:1px dashed #cbd4e3;border-radius:14px;color:var(--muted)}.notice{padding:12px 14px;border-radius:10px;background:#fff7e6;color:#7b4b00;margin:12px 0;font-size:13px}.success{background:#eaf8f1;color:#096844}.error{background:#fff0ef;color:#a52219}.toast{position:fixed;right:18px;bottom:18px;z-index:20;background:var(--navy);color:white;padding:13px 17px;border-radius:12px;max-width:360px;box-shadow:0 10px 30px #0002}.divider{border:0;border-top:1px solid var(--line);margin:18px 0}.footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item-row{display:flex;justify-content:space-between;align-items:start;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}.item-row:last-child{border:0}.right{text-align:right}.demo-label{display:inline-flex;gap:6px;align-items:center;border:1px solid #bfd0ff;background:#eaf0ff;color:#2149aa;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:850}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#dfe8ff;color:#234bb2;font-weight:900;flex-shrink:0}
@media(max-width:800px){.hero-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.dash{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:4px}.side button{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:540px){.wrap{padding:0 13px}.hero{padding:35px 0}.grid,.two{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.nav{padding:10px 0}.hero-card{padding:16px}.nav-right{gap:5px}.nav-right button{padding:8px 10px}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><div class="brand" role="button" tabindex="0" data-action="home">Hire<span>Hub</span></div><div class="nav-right"><span class="demo-label">● INTERACTIVE DEMO</span><select id="language" aria-label="Language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="te">తెలుగు</option></select><select id="currency" aria-label="Display currency"><option value="INR">INR ₹</option><option value="USD">USD $</option><option value="EUR">EUR €</option><option value="GBP">GBP £</option></select><button class="secondary" data-action="login">Log in</button><button class="primary" data-action="register">Get started</button><button class="outline hidden" data-action="logout" id="logout-btn">Log out</button></div></div></header>
<main id="app"></main>
<footer class="footer"><div class="wrap">HireHub · Find • Apply • Grow · <b>Demo mode:</b> changes are stored in this browser only. No real applications are sent. <button class="outline" data-action="reset" style="float:right;padding:5px 9px">Reset demo</button></div></footer>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='hirehub_demo_v3';
const initial=()=>({
jobs:[
{id:'j1',title:'Junior Frontend Developer',company:'PixelWorks',location:'Hyderabad / Remote',type:'Internship',pay:18000,skills:['HTML','CSS','JavaScript'],description:'Build accessible web interfaces with a supportive engineering team.',owner:'r1',status:'Published'},
{id:'j2',title:'Cybersecurity Intern',company:'SecureNest',location:'Warangal, Telangana',type:'Internship',pay:12000,skills:['Linux','Networking','Security'],description:'Help review security alerts, document findings and learn core security practices.',owner:'r1',status:'Published'},
{id:'j3',title:'Data Analyst Trainee',company:'Northstar Labs',location:'Remote',type:'Full-time',pay:28000,skills:['Python','SQL','Excel'],description:'Turn messy data into useful reports and business insights.',owner:'r2',status:'Published'}
],
gigs:[
{id:'g1',title:'Event Setup Assistant',location:'Hanamkonda, Warangal',date:'2026-10-18',pay:900,poster:'Campus Events',kind:'Business',description:'Help arrange chairs, banners and registration desk for a student event.',status:'Published',owner:'r1'},
{id:'g2',title:'Electrician Helper for One Day',location:'Warangal',date:'2026-10-15',pay:800,poster:'Ramesh K.',kind:'Individual',description:'Assist an experienced electrician with basic setup and carrying equipment.',status:'Published',owner:'r2'},
{id:'g3',title:'Weekend Store Assistant',location:'Kazipet, Warangal',date:'2026-10-24',pay:1200,poster:'DailyMart',kind:'Business',description:'Help organise stock and support customers for one weekend day.',status:'Published',owner:'r1'}
],
applications:[
{id:'a1',jobId:'j1',jobTitle:'Junior Frontend Developer',candidate:'Ananya Rao',email:'ananya.demo@example.com',status:'Shortlisted',date:'2026-10-09',owner:'r1',skills:'HTML, CSS, JavaScript'},
{id:'a2',jobId:'j2',jobTitle:'Cybersecurity Intern',candidate:'Arjun Kumar',email:'arjun.demo@example.com',status:'Applied',date:'2026-10-10',owner:'r1',skills:'Linux, networking, Python'}
],
gigApplications:[],projects:[{id:'p1',title:'Portfolio Website',description:'Responsive personal portfolio built with HTML and CSS.',link:'https://github.com/'}],cvs:[],reports:[],notifications:[],users:[{id:'r1',name:'Demo Recruiter',email:'recruiter@hirehub.demo',role:'recruiter'},{id:'r2',name:'Demo Job Seeker',email:'seeker@hirehub.demo',role:'seeker'},{id:'r3',name:'Demo Gig Worker',email:'worker@hirehub.demo',role:'worker'},{id:'admin',name:'Demo Moderator',email:'moderator@hirehub.demo',role:'admin'}]
});
let db, user=null, view='home', authMode='login', toastTimer=null, lang='en', currency='INR', filter='';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.jobs&&x.gigs)return x}catch(e){}return initial()}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function id(prefix){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6)}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3000)}
function money(n){const rates={INR:1,USD:1/83.5,EUR:1/90,GBP:1/105};const symbols={INR:'₹',USD:'$',EUR:'€',GBP:'£'};return symbols[currency]+Math.round(Number(n)*(rates[currency]||1)).toLocaleString()}
function home(){view='home';user=null;render();window.scrollTo(0,0)}
function demoLogin(role){const roles={seeker:['r2','Demo Job Seeker','seeker@hirehub.demo'],recruiter:['r1','Demo Recruiter','recruiter@hirehub.demo'],worker:['r3','Demo Gig Worker','worker@hirehub.demo'],admin:['admin','Demo Moderator','moderator@hirehub.demo']};const a=roles[role]||roles.seeker;user={id:a[0],name:a[1],email:a[2],role};view='overview';render();toast('Signed in as '+user.name+'. Demo only — no real account created.')}
function auth(mode){authMode=mode;view='auth';render()}
function roleName(r){return ({seeker:'Job Seeker',recruiter:'Recruiter',worker:'Gig Worker / Poster',admin:'Moderator'})[r]||r}
function landing(){return `<section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">Find • Apply • Grow</div><h1>Work that moves you forward.</h1><p>Find jobs, show your skills, practise interviews, and discover local gigs — all in one place.</p><div class="searchbox"><input id="home-q" placeholder="Search jobs, skills or titles"><input id="home-loc" placeholder="City, state or remote"><button class="primary" data-action="home-search">Find work</button></div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:16px"><button class="primary" data-action="demo-seeker">Try Job Seeker Demo</button><button class="secondary" data-action="demo-recruiter">Try Recruiter Demo</button><button class="secondary" data-action="demo-worker">Try Gigs Demo</button></div><p class="small">No signup, passwords, API keys, or database setup required.</p></div><div class="hero-card"><span class="demo-label">LIVE INTERACTIVE DEMO</span><h2>Your career workspace</h2><p>Explore the core HireHub workflows using realistic sample data.</p><div class="item-row"><div><b>Discover</b><div class="muted small">Jobs, internships and gigs</div></div><span>01</span></div><div class="item-row"><div><b>Get ready</b><div class="muted small">Career Bridge, CV and interviews</div></div><span>02</span></div><div class="item-row"><div><b>Hire fairly</b><div class="muted small">Manage applicants and reports</div></div><span>03</span></div></div></div></section><section class="wrap section"><div class="section-head"><div><h2>Featured opportunities</h2><p class="muted">Sample listings for demonstration.</p></div><button class="outline" data-action="browse-jobs">Browse all jobs</button></div><div class="grid">${db.jobs.filter(j=>j.status==='Published').slice(0,3).map(jobCard).join('')}</div></section><section class="wrap section"><div class="grid"><div class="card"><span class="tag">CAREER BRIDGE</span><h3>See your skill gaps</h3><p class="muted">Compare your current skills with a job and get a learning roadmap.</p></div><div class="card"><span class="tag">RECRUITER WORKSPACE</span><h3>Manage applicants</h3><p class="muted">Post roles, review candidate evidence, and update application status.</p></div><div class="card"><span class="tag">LOCAL GIGS</span><h3>Find flexible work</h3><p class="muted">Browse one-day jobs posted by people and businesses.</p></div></div></section>`}
function jobCard(j){return `<article class="card"><span class="tag">${esc(j.type||'Job')}</span><h3>${esc(j.title)}</h3><p><b>${esc(j.company||'Employer')}</b></p><p class="muted small">📍 ${esc(j.location)} · ${money(j.pay)}/month</p><div>${(j.skills||[]).slice(0,4).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div><div class="actions"><button class="primary" data-action="apply-job" data-id="${esc(j.id)}">Apply in demo</button><button class="outline" data-action="report" data-kind="job" data-id="${esc(j.id)}">Report</button></div></article>`}
function authPage(){return `<div class="auth-area"><div class="auth-card"><div class="brand" style="color:var(--navy)">Hire<span>Hub</span></div><h1>${authMode==='register'?'Create your account':'Welcome back'}</h1><p class="muted">This is a local interactive demo. Use the role shortcuts below to enter instantly.</p><form id="auth-form"><div class="field"><label for="auth-email">Email</label><input id="auth-email" type="email" placeholder="you@example.com" required></div><div class="field"><label for="auth-password">Password</label><input id="auth-password" type="password" minlength="6" placeholder="Any demo password (6+ characters)" required></div><div class="field ${authMode==='register'?'':'hidden'}" id="auth-name-field"><label for="auth-name">Full name</label><input id="auth-name" placeholder="Your name"></div><div class="field ${authMode==='register'?'':'hidden'}" id="auth-role-field"><label for="auth-role">I am a</label><select id="auth-role"><option value="seeker">Job Seeker</option><option value="recruiter">Recruiter</option><option value="worker">Gig Worker / Poster</option></select></div><div id="auth-message" class="notice error hidden"></div><button class="primary" type="submit" style="width:100%">${authMode==='register'?'Create demo account':'Log in to demo'}</button></form><hr class="divider"><p class="muted small">Or skip the form and open a preloaded demo role:</p><div class="actions"><button class="outline" data-action="demo-seeker">Job Seeker</button><button class="outline" data-action="demo-recruiter">Recruiter</button><button class="outline" data-action="demo-worker">Gig Worker</button><button class="outline" data-action="demo-admin">Moderator</button></div><p class="small muted">Demo credentials are not production authentication. Do not enter a real password.</p><button class="outline" data-action="home">Back to home</button></div></div>`}
function navItems(){let common=[['overview','Overview'],['jobs','Find Jobs'],['gigs','Local Gigs'],['career','Career Bridge'],['cv','CV Builder'],['projects','Proof of Skill'],['interview','Interview Practice'],['applications','My Applications']];if(user.role==='recruiter')common=[['overview','Overview'],['myjobs','Manage Jobs'],['applicants','Applicants'],['gigs','Local Gigs'],['mygigs','My Gigs'],['interview','Interview Practice']];if(user.role==='worker')common=[['overview','Overview'],['gigs','Browse Gigs'],['mygigs','My Posted Gigs'],['gigapps','Gig Applications'],['projects','My Profile']];if(user.role==='admin')common=[['overview','Overview'],['moderation','Moderation'],['jobs','Browse Jobs'],['gigs','Local Gigs'],['applications','Applications']];return common}
function dashboard(){let nav=navItems();return `<div class="wrap dash"><aside class="side"><div style="display:flex;align-items:center;gap:10px;padding:9px 7px 14px"><div class="avatar">${esc(user.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</div><div><b>${esc(user.name)}</b><div class="muted small">${esc(roleName(user.role))}</div></div></div><hr class="divider">${nav.map(([v,l])=>`<button class="${view===v?'active':''}" data-action="view" data-view="${v}">${l}</button>`).join('')}<hr class="divider"><button data-action="home">← Public homepage</button><button data-action="reset" class="danger">Reset demo data</button></aside><section class="dash-main"><div class="dash-head"><div><h1>${nav.find(x=>x[0]===view)?.[1]||'Your workspace'}</h1><p class="muted small">Interactive demo workspace · changes save in this browser</p></div><span class="demo-label">DEMO MODE</span></div>${pageContent()}</section></div>`}
function pageContent(){switch(view){case'overview':return overview();case'jobs':return jobsPage();case'myjobs':return myJobs();case'applicants':return applicants();case'gigs':return gigsPage();case'mygigs':return myGigs();case'gigapps':return gigApps();case'applications':return applicationsPage();case'career':return careerPage();case'cv':return cvPage();case'projects':return projectsPage();case'interview':return interviewPage();case'moderation':return moderationPage();default:view='overview';return overview()}}
function overview(){let n=user.role==='recruiter'?db.jobs.filter(x=>x.owner===user.id).length:user.role==='admin'?db.reports.length:db.applications.filter(x=>x.candidateId===user.id).length;return `<div class="stats"><div class="stat"><span class="muted small">${user.role==='recruiter'?'Your jobs':'Your applications'}</span><strong>${n}</strong></div><div class="stat"><span class="muted small">Available jobs</span><strong>${db.jobs.filter(x=>x.status==='Published').length}</strong></div><div class="stat"><span class="muted small">Local gigs</span><strong>${db.gigs.filter(x=>x.status==='Published').length}</strong></div></div><div class="card"><h3>Welcome, ${esc(user.name.split(' ')[0])}!</h3><p class="muted">Choose a workflow below to explore the demo.</p><div class="actions"><button class="primary" data-action="view" data-view="${user.role==='recruiter'?'myjobs':user.role==='admin'?'moderation':'jobs'}">${user.role==='recruiter'?'Post or manage a job':user.role==='admin'?'Review reports':'Find a job'}</button><button class="outline" data-action="view" data-view="gigs">Explore local gigs</button>${user.role==='seeker'?'<button class="outline" data-action="view" data-view="career">Try Career Bridge</button>':''}</div></div><div class="section"><div class="section-head"><h2>Recommended jobs</h2><button class="outline" data-action="view" data-view="jobs">See all</button></div><div class="grid">${db.jobs.filter(j=>j.status==='Published').slice(0,2).map(jobCard).join('')}</div></div>`}
function jobsPage(){let arr=db.jobs.filter(j=>j.status==='Published'&&(user.role!=='recruiter'||j.owner!==user.id));if(filter)arr=arr.filter(j=>(j.title+' '+j.company+' '+j.location+' '+j.skills.join(' ')).toLowerCase().includes(filter.toLowerCase()));return `<div class="toolbar"><input id="job-filter" placeholder="Search title, skill, company or location" value="${esc(filter)}"><button class="primary" data-action="filter-jobs">Search</button><button class="outline" data-action="clear-filter">Clear</button></div><div class="list">${arr.length?arr.map(j=>`<article class="job-item"><div class="job-top"><div><h3>${esc(j.title)}</h3><b>${esc(j.company)}</b><p class="muted small">📍 ${esc(j.location)} · ${esc(j.type)} · ${money(j.pay)}/month</p></div><span class="status good">Published</span></div><p>${esc(j.description)}</p><div>${j.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div><div class="actions"><button class="primary" data-action="apply-job" data-id="${esc(j.id)}">Apply now</button><button class="outline" data-action="report" data-kind="job" data-id="${esc(j.id)}">Report listing</button></div></article>`).join(''):'<div class="empty">No matching jobs. Try another search.</div>'}</div>`}
function myJobs(){if(user.role!=='recruiter')return '<div class="notice">Recruiter role required in this demo.</div>';let arr=db.jobs.filter(j=>j.owner===user.id);return `<div class="card"><h3>Post a job</h3><form id="job-form"><div class="two"><div class="field"><label>Job title</label><input name="title" required placeholder="e.g. Junior Developer"></div><div class="field"><label>Company</label><input name="company" required value="Demo Company"></div></div><div class="two"><div class="field"><label>Location</label><input name="location" required placeholder="Warangal / Remote"></div><div class="field"><label>Employment type</label><select name="type"><option>Internship</option><option>Full-time</option><option>Part-time</option><option>Remote</option></select></div></div><div class="two"><div class="field"><label>Monthly pay (INR)</label><input name="pay" type="number" min="1" required value="15000"></div><div class="field"><label>Skills (comma separated)</label><input name="skills" required placeholder="HTML, CSS, JavaScript"></div></div><div class="field"><label>Description</label><textarea name="description" required placeholder="What will the person do?"></textarea></div><button class="primary">Publish demo job</button></form></div><div class="section"><h2>Your listings (${arr.length})</h2><div class="list">${arr.length?arr.map(j=>`<article class="job-item"><div class="job-top"><div><h3>${esc(j.title)}</h3><p class="muted small">${esc(j.location)} · ${money(j.pay)}/month</p></div><span class="status ${j.status==='Published'?'good':'warn'}">${esc(j.status)}</span></div><div class="actions"><button class="outline" data-action="view-applicants" data-id="${esc(j.id)}">View applicants (${db.applications.filter(a=>a.jobId===j.id).length})</button><button class="danger" data-action="close-job" data-id="${esc(j.id)}">${j.status==='Published'?'Close job':'Reopen job'}</button></div></article>`).join(''):'<div class="empty">You have not posted a job yet.</div>'}</div></div>`}
function applicants(){if(user.role!=='recruiter')return '<div class="notice">Recruiter role required.</div>';let arr=db.applications.filter(a=>db.jobs.some(j=>j.id===a.jobId&&j.owner===user.id));return `<div class="list">${arr.length?arr.map(a=>`<article class="job-item"><div class="job-top"><div><h3>${esc(a.candidate||'Demo candidate')}</h3><p class="muted small">${esc(a.jobTitle)} · ${esc(a.email||'demo@example.com')}</p><p>Skills: ${esc(a.skills||'Not provided')}</p></div><span class="status">${esc(a.status)}</span></div><div class="toolbar"><select id="status-${esc(a.id)}">${['Applied','Under Review','Shortlisted','Interview','Selected','Rejected'].map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select><button class="primary" data-action="update-status" data-id="${esc(a.id)}">Save status</button></div></article>`).join(''):'<div class="empty">No applicants yet. Apply to one of your jobs as a seeker to test the flow.</div>'}</div>`}
function gigsPage(){let arr=db.gigs.filter(g=>g.status==='Published'&&(user.role!=='worker'||g.owner!==user.id));if(filter)arr=arr.filter(g=>(g.title+' '+g.location+' '+g.description).toLowerCase().includes(filter.toLowerCase()));return `<div class="toolbar"><input id="gig-filter" placeholder="Search gigs or locations" value="${esc(filter)}"><button class="primary" data-action="filter-gigs">Search</button><button class="outline" data-action="clear-filter">Clear</button>${['recruiter','worker'].includes(user.role)?'<button class="outline" data-action="view" data-view="mygigs">Post/manage gigs</button>':''}</div><div class="grid">${arr.length?arr.map(g=>`<article class="card"><span class="tag">${esc(g.kind||'Local gig')}</span><h3>${esc(g.title)}</h3><p class="muted small">📍 ${esc(g.location)} · ${esc(g.date||'Date flexible')}</p><h3>${money(g.pay)} <span class="muted small">/ day</span></h3><p>${esc(g.description)}</p><p class="small muted">Posted by ${esc(g.poster)}</p><div class="actions"><button class="primary" data-action="apply-gig" data-id="${esc(g.id)}">Apply for gig</button><button class="outline" data-action="report" data-kind="gig" data-id="${esc(g.id)}">Report</button></div></article>`).join(''):'<div class="empty">No matching gigs.</div>'}</div>`}
function myGigs(){if(!['recruiter','worker'].includes(user.role))return '<div class="notice">Choose Recruiter or Gig Worker demo to post gigs.</div>';let arr=db.gigs.filter(g=>g.owner===user.id);return `<div class="card"><h3>Post a local gig</h3><form id="gig-form"><div class="two"><div class="field"><label>Gig title</label><input name="title" required placeholder="Event helper for one day"></div><div class="field"><label>Location</label><input name="location" required placeholder="Warangal"></div></div><div class="two"><div class="field"><label>Date</label><input name="date" type="date" required></div><div class="field"><label>Pay (INR/day)</label><input name="pay" type="number" min="1" required value="800"></div></div><div class="field"><label>Description</label><textarea name="description" required></textarea></div><button class="primary">Post demo gig</button></form></div><div class="section"><h2>Your gigs</h2><div class="list">${arr.length?arr.map(g=>`<article class="job-item"><h3>${esc(g.title)}</h3><p class="muted small">${esc(g.location)} · ${money(g.pay)}/day</p><div class="actions"><button class="outline" data-action="view-gig-apps" data-id="${esc(g.id)}">Applicants (${db.gigApplications.filter(a=>a.gigId===g.id).length})</button><button class="danger" data-action="close-gig" data-id="${esc(g.id)}">${g.status==='Published'?'Close gig':'Reopen gig'}</button></div></article>`).join(''):'<div class="empty">No gigs posted by this demo account.</div>'}</div></div>`}
function gigApps(){let arr=db.gigApplications.filter(a=>a.candidateId===user.id);return `<div class="list">${arr.length?arr.map(a=>`<article class="job-item"><h3>${esc(a.gigTitle)}</h3><p class="muted small">Application status: ${esc(a.status)}</p></article>`).join(''):'<div class="empty">No gig applications yet. Browse gigs and apply.</div>'}</div>`}
function applicationsPage(){let arr=db.applications.filter(a=>a.candidateId===user.id||(!a.candidateId&&user.role==='seeker'));return `<div class="list">${arr.length?arr.map(a=>`<article class="job-item"><div class="job-top"><div><h3>${esc(a.jobTitle)}</h3><p class="muted small">Applied ${esc(a.date||'today')}</p></div><span class="status ${a.status==='Selected'?'good':''}">${esc(a.status)}</span></div></article>`).join(''):'<div class="empty">No applications yet. Find a job and select Apply now.</div>'}</div>`}
function careerPage(){return `<div class="card"><h3>Career Bridge — demo skill-gap analysis</h3><p class="muted">Compare your current skills with a target job. This is a local rule-based demo, not a real AI response.</p><form id="career-form"><div class="field"><label>Target role</label><select name="jobId">${db.jobs.filter(j=>j.status==='Published').map(j=>`<option value="${esc(j.id)}">${esc(j.title)}</option>`).join('')}</select></div><div class="field"><label>Your skills (comma separated)</label><input name="skills" required placeholder="Python, HTML, Linux"></div><button class="primary">Analyse skill gap</button></form><div id="career-result"></div></div>`}
function cvPage(){let cv=db.cvs.find(c=>c.userId===user.id);return `<div class="card"><h3>CV Builder</h3><p class="muted">Create a simple CV and export it using your browser's print-to-PDF option.</p><form id="cv-form"><div class="two"><div class="field"><label>Full name</label><input name="name" required value="${esc(cv?.name||user.name)}"></div><div class="field"><label>Email</label><input name="email" type="email" required value="${esc(cv?.email||user.email)}"></div></div><div class="field"><label>Education</label><input name="education" required value="${esc(cv?.education||'Computer Science undergraduate')}"></div><div class="field"><label>Skills</label><input name="skills" required value="${esc(cv?.skills||'Python, HTML, Communication')}"></div><div class="field"><label>Projects / experience</label><textarea name="experience">${esc(cv?.experience||'Built a student portfolio website.')}</textarea></div><button class="primary">Save CV</button><button type="button" class="outline" data-action="export-cv">Preview / Print PDF</button></form><div id="cv-preview"></div></div>`}
function projectsPage(){let arr=db.projects.filter(p=>p.userId===user.id||p.userId==='r2');return `<div class="card"><h3>Proof of Skill</h3><p class="muted">Add projects and portfolio links to show what you can do.</p><form id="project-form"><div class="field"><label>Project name</label><input name="title" required placeholder="e.g. Student planner"></div><div class="field"><label>Description</label><textarea name="description" required></textarea></div><div class="field"><label>Project URL (optional)</label><input name="link" type="url" placeholder="https://github.com/yourname/project"></div><button class="primary">Add project</button></form><hr class="divider"><div>${arr.length?arr.map(p=>`<div class="item-row"><div><b>${esc(p.title)}</b><p class="muted small">${esc(p.description)}</p>${p.link?`<a href="${esc(p.link)}" target="_blank" rel="noopener noreferrer">Open project</a>`:''}</div><button class="danger" data-action="delete-project" data-id="${esc(p.id)}">Delete</button></div>`).join(''):'<div class="empty">No projects added yet.</div>'}</div></div>`}
function interviewPage(){return `<div class="card"><h3>Interview Practice</h3><p class="muted">Demo questions and feedback are generated locally; no external AI is called.</p><form id="interview-form"><div class="two"><div class="field"><label>Target role</label><input name="role" required value="Junior Software Developer"></div><div class="field"><label>Topics</label><input name="skills" required value="JavaScript, problem solving"></div></div><button class="primary">Start practice</button></form><div id="interview-result"></div></div>`}
function moderationPage(){let arr=db.reports;return `<div class="notice">Demo moderation only. Reports and actions are stored locally and do not contact a real platform team.</div><div class="list">${arr.length?arr.map(r=>`<article class="job-item"><div class="job-top"><div><h3>${esc(r.kind)} report</h3><p>${esc(r.reason)}</p><p class="muted small">Target: ${esc(r.targetId)} · Submitted ${esc(r.date)}</p></div><span class="status ${r.status==='Resolved'?'good':'warn'}">${esc(r.status)}</span></div><div class="actions"><button class="primary" data-action="resolve-report" data-id="${esc(r.id)}">Mark resolved</button><button class="outline" data-action="dismiss-report" data-id="${esc(r.id)}">Dismiss</button></div></article>`).join(''):'<div class="empty">No reports yet. Use Report on any job or gig to test moderation.</div>'}</div>`}
function render(){const app=$('#app');app.innerHTML=view==='home'?landing():view==='auth'?authPage():dashboard();$('#logout-btn').classList.toggle('hidden',!user);$('#nav-login').textContent=user?'Dashboard':'Log in';$('#nav-register').textContent=user?'Switch role':'Get started';}
function applyJob(jobId){if(!user){auth('login');toast('Open a demo role to apply.');return}if(user.role!=='seeker'){toast('Switch to Job Seeker demo to apply to jobs.');return}const j=db.jobs.find(x=>x.id===jobId);if(!j)return;if(db.applications.some(a=>a.jobId===jobId&&a.candidateId===user.id)){toast('You already applied to this job.');return}db.applications.unshift({id:id('a'),jobId,jobTitle:j.title,candidate:user.name,email:user.email,status:'Applied',date:new Date().toISOString().slice(0,10),candidateId:user.id,owner:j.owner,skills:'Skills added in demo profile'});save();render();toast('Demo application submitted and saved locally.')}
function report(kind,targetId){const reason=prompt('Why are you reporting this '+kind+'?');if(!reason||!reason.trim())return;db.reports.unshift({id:id('rep'),kind,targetId,reason:reason.trim(),status:'Pending',date:new Date().toISOString().slice(0,10)});save();toast('Demo report saved.');render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action, idv=b.dataset.id;
if(a==='home'){home()}else if(a==='login'){auth('login')}else if(a==='register'){auth('register')}else if(a==='logout'){user=null;view='home';render();toast('Logged out of demo.')}else if(a==='demo-seeker'){demoLogin('seeker')}else if(a==='demo-recruiter'){demoLogin('recruiter')}else if(a==='demo-worker'){demoLogin('worker')}else if(a==='demo-admin'){demoLogin('admin')}else if(a==='view'){view=b.dataset.view;filter='';render()}else if(a==='browse-jobs'){if(user){view='jobs';render()}else{view='auth';authMode='login';render()}}else if(a==='home-search'){filter=$('#home-q').value.trim();if(!user){demoLogin('seeker');view='jobs';render()}else{view='jobs';render()}setTimeout(()=>{const f=$('#job-filter');if(f){f.value=filter}},0)}else if(a==='filter-jobs'){filter=$('#job-filter').value.trim();render()}else if(a==='filter-gigs'){filter=$('#gig-filter').value.trim();render()}else if(a==='clear-filter'){filter='';render()}else if(a==='apply-job'){applyJob(idv)}else if(a==='apply-gig'){if(!user){auth('login');return}if(user.role!=='worker'&&user.role!=='seeker'){toast('Switch to Gig Worker demo to apply.');return}const g=db.gigs.find(x=>x.id===idv);if(db.gigApplications.some(x=>x.gigId===idv&&x.candidateId===user.id)){toast('Already applied to this gig.');return}db.gigApplications.unshift({id:id('ga'),gigId:idv,gigTitle:g.title,candidateId:user.id,status:'Applied'});save();render();toast('Demo gig application saved.')}else if(a==='report'){report(b.dataset.kind,idv)}else if(a==='update-status'){const s=$('#status-'+CSS.escape(idv));const app=db.applications.find(x=>x.id===idv);if(app&&s){app.status=s.value;save();render();toast('Application status updated in demo.')}}else if(a==='view-applicants'){view='applicants';render()}else if(a==='close-job'){const j=db.jobs.find(x=>x.id===idv);if(j){j.status=j.status==='Published'?'Closed':'Published';save();render();toast('Job status changed.')}}else if(a==='close-gig'){const g=db.gigs.find(x=>x.id===idv);if(g){g.status=g.status==='Published'?'Closed':'Published';save();render();toast('Gig status changed.')}}else if(a==='view-gig-apps'){const list=db.gigApplications.filter(x=>x.gigId===idv);alert(list.length?list.map(x=>x.candidateId+' — '+x.status).join('\\n'):'No applicants yet.');}else if(a==='delete-project'){db.projects=db.projects.filter(x=>x.id!==idv);save();render();toast('Project deleted.')}else if(a==='resolve-report'||a==='dismiss-report'){const r=db.reports.find(x=>x.id===idv);if(r){r.status=a==='resolve-report'?'Resolved':'Dismissed';save();render();toast('Moderation status updated.')}}else if(a==='export-cv'){const c=db.cvs.find(x=>x.userId===user.id);if(!c){toast('Save your CV first.');return}const w=window.open('','_blank');if(!w){toast('Allow pop-ups to print your CV.');return}w.document.write('<!doctype html><html><head><title>CV</title><style>body{font:16px Arial;max-width:800px;margin:40px auto;line-height:1.6}h1{border-bottom:2px solid #222;padding-bottom:8px}</style></head><body><h1>'+esc(c.name)+'</h1><p>'+esc(c.email)+'</p><h2>Education</h2><p>'+esc(c.education)+'</p><h2>Skills</h2><p>'+esc(c.skills)+'</p><h2>Projects / Experience</h2><p>'+esc(c.experience).replace(/\\n/g,'<br>')+'</p><script>window.onload=()=>window.print()<\\/script></body></html>');w.document.close()}else if(a==='reset'){if(confirm('Reset all local demo changes and restore sample data?')){localStorage.removeItem(KEY);db=initial();save();user=null;view='home';filter='';render();toast('Demo data reset.')}}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target, data=Object.fromEntries(new FormData(f).entries());
if(f.id==='auth-form'){const msg=$('#auth-message'),email=$('#auth-email').value.trim(),password=$('#auth-password').value;if(password.length<6){msg.textContent='Use at least 6 characters for this demo password.';msg.classList.remove('hidden');return}if(authMode==='register'){const role=$('#auth-role').value;user={id:id('user'),name:$('#auth-name').value.trim()||email.split('@')[0],email,role};db.users.push({...user});save();view='overview';render();toast('Demo account created in this browser.')}else{const known=db.users.find(x=>x.email.toLowerCase()===email.toLowerCase());if(known){user={...known};view='overview';render();toast('Welcome back to demo mode.')}else{msg.textContent='No demo account found for that email. Use a role shortcut or choose Get started to create a local demo account.';msg.classList.remove('hidden')}}}
else if(f.id==='job-form'){if(!user||user.role!=='recruiter')return;db.jobs.unshift({id:id('j'),title:data.title,company:data.company,location:data.location,type:data.type,pay:Number(data.pay),skills:data.skills.split(',').map(s=>s.trim()).filter(Boolean),description:data.description,owner:user.id,status:'Published'});save();render();toast('Job posted to local demo data.')}
else if(f.id==='gig-form'){if(!user||!['recruiter','worker'].includes(user.role))return;db.gigs.unshift({id:id('g'),title:data.title,location:data.location,date:data.date,pay:Number(data.pay),poster:user.name,kind:user.role==='recruiter'?'Business':'Individual',description:data.description,status:'Published',owner:user.id});save();render();toast('Gig posted to local demo data.')}
else if(f.id==='career-form'){const job=db.jobs.find(j=>j.id===data.jobId),have=data.skills.toLowerCase().split(',').map(s=>s.trim()).filter(Boolean),required=job.skills||[],matched=required.filter(s=>have.some(h=>h.includes(s.toLowerCase())||s.toLowerCase().includes(h))),missing=required.filter(s=>!matched.includes(s)),score=Math.round(matched.length/Math.max(required.length,1)*100);$('#career-result').innerHTML=`<div class="section"><span class="demo-label">DEMO ANALYSIS · ${score}% MATCH</span><h3>${esc(job.title)}</h3><p><b>Skills you listed that match:</b> ${matched.length?matched.map(esc).join(', '):'None yet — that is okay; start with the roadmap.'}</p><p><b>Skills to build:</b> ${missing.length?missing.map(esc).join(', '):'No major gaps in the listed skills.'}</p><h3>Suggested roadmap</h3><ol>${(missing.length?missing:['Build one portfolio project']).map(s=>`<li>Learn ${esc(s)} fundamentals, practise with a small exercise, then add evidence to your portfolio.</li>`).join('')}<li>Build a role-relevant project and document your decisions.</li><li>Practise explaining what you built and what you would improve.</li></ol><p class="muted small">This transparent demo compares keywords only. It is not an AI assessment or a hiring recommendation.</p></div>`}
else if(f.id==='cv-form'){let c={userId:user.id,name:data.name,email:data.email,education:data.education,skills:data.skills,experience:data.experience};const old=db.cvs.findIndex(x=>x.userId===user.id);if(old>=0)db.cvs[old]=c;else db.cvs.push(c);save();$('#cv-preview').innerHTML=`<div class="notice success">CV saved locally.</div><div class="card"><h2>${esc(c.name)}</h2><p>${esc(c.email)}</p><h3>Education</h3><p>${esc(c.education)}</p><h3>Skills</h3><p>${esc(c.skills)}</p><h3>Projects / Experience</h3><p>${esc(c.experience)}</p></div>`;toast('CV saved. Use Preview / Print PDF to export.')}
else if(f.id==='project-form'){db.projects.unshift({id:id('p'),userId:user.id,title:data.title,description:data.description,link:data.link});save();render();toast('Project added to your portfolio.')}
else if(f.id==='interview-form'){const role=data.role,skills=data.skills.split(',').map(s=>s.trim()).filter(Boolean),qs=[`Tell me about a project relevant to ${role}.`,`Explain one core concept in ${skills[0]||'your main skill'}.`,`Describe a time you debugged a difficult problem.`,`How would you test a solution before sharing it?`,`What would you learn next to become stronger in ${role}?`];$('#interview-result').innerHTML=`<div class="section"><span class="demo-label">DEMO QUESTION BANK</span><ol>${qs.map((q,i)=>`<li style="margin:12px 0"><b>${esc(q)}</b><div class="field"><label>Your answer</label><textarea id="answer-${i}" placeholder="Write your answer here..."></textarea></div><button class="outline" data-action="feedback" data-index="${i}">Get demo feedback</button><div id="feedback-${i}"></div></li>`).join('')}</ol></div>`}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="feedback"]');if(!b)return;const box=$('#feedback-'+b.dataset.index),answer=$('#answer-'+b.dataset.index).value.trim();if(!answer){box.innerHTML='<p class="notice error">Write an answer first.</p>';return}const words=answer.split(/\\s+/).length;box.innerHTML=`<p class="notice success">Demo feedback: ${words<20?'Add more detail and a concrete example.':'Good start. Make your answer stronger by explaining the context, your specific actions, and the result.'} This is rule-based sample feedback, not real AI evaluation.</p>`});
$('#language').addEventListener('change',e=>{lang=e.target.value;toast(lang==='hi'?'डेमो भाषा चुनी गई। कुछ सामग्री अभी अंग्रेज़ी में है।':lang==='te'?'డెమో భాష ఎంచుకోబడింది. కొంత కంటెంట్ ఇంకా ఇంగ్లీష్‌లో ఉంది.':'English selected. Some content remains in English.')} );
$('#currency').addEventListener('change',e=>{currency=e.target.value;render();toast('Display currency changed. Demo conversion uses fixed illustrative rates, not live exchange rates.')});
db=load();save();render();
